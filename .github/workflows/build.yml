name: Build Manager

on:
  push:
    tags: [ "*" ]
    branches: [ "miuix" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  pull_request:
    branches: [ "miuix" ]
    paths:
      - '.github/workflows/build.yml'
      - 'app/**'
      - 'apd/**'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
  workflow_call:
  workflow_dispatch:

jobs:
  build-manager:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate version
        id: parse_version
        run: |
          COMMIT_NUM=$(git rev-list --count HEAD)
          VERSION=$(echo "$COMMIT_NUM + 200 + 13000" | bc)
          echo "Generated Version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install toolchain
        run: |
          rustup update stable
          cargo install cargo-ndk --locked || true
          rustup target install aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apd
          cache-targets: false

      - name: Write key
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "KEYSTORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> gradle.properties
            echo "KEY_ALIAS=${{ secrets.ALIAS }}" >> gradle.properties
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> gradle.properties
            echo "KEYSTORE_FILE=key.jks" >> gradle.properties
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > key.jks
          fi

      - name: Build with Gradle
        run: |
          echo "org.gradle.parallel=true" >> gradle.properties
          echo "org.gradle.vfs.watch=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          echo "android.native.buildOutput=verbose" >> gradle.properties
          sed -i '/org.gradle.configuration-cache/d' gradle.properties
          ./gradlew assembleRelease

      # - name: Upload mappings
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: "mappings"
      #     path: "app/build/outputs/mapping/release/"

      # - name: Upload APK artifact
      #   uses: actions/upload-artifact@v5
      #   with:
      #     name: "release-apk"
      #     path: "app/build/outputs/apk/release/*.apk"

      # 新增：手动创建并推送tag（替代旧版 createTag: true）
      - name: Create git tag
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: env.SIGNING_KEY != '' && github.event_name != 'pull_request'
        run: |
          TAG_NAME="${{ steps.parse_version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "tags/$TAG_NAME" >/dev/null 2>&1; then
            git tag "$TAG_NAME"
            git push origin "tags/$TAG_NAME"
          fi

      - name: Release apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        if: env.SIGNING_KEY != '' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.parse_version.outputs.VERSION }}
          # createTag: true  # ❌ 已删除，该参数不再支持
          artifacts: app/build/outputs/apk/release/*.apk
          generateReleaseNotes: true
          makeLatest: true
          replacesArtifacts: true
